<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vynxgram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#1E1F22', bgMid: '#2B2D31', bgLight: '#313338', bgHover: '#3F4147',
                        brand: '#5865F2', brandHover: '#4752C4', textMain: '#F2F3F5', textMuted: '#B5BAC1'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1A1B1E; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .msg-bubble { max-width: 85%; }
        .attachment-img { max-width: 400px; max-height: 300px; border-radius: 8px; object-fit: cover; margin-top: 8px; }
    </style>
</head>
<body class="bg-bgDark text-textMain h-screen w-screen overflow-hidden flex antialiased">

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="auth-screen" class="absolute inset-0 z-50 bg-bgDark flex items-center justify-center">
        <div class="bg-bgMid p-8 rounded-xl shadow-xl w-full max-w-sm border border-bgHover text-center">
            <i class="ph-fill ph-planet text-brand text-5xl mb-2 inline-block"></i>
            <h1 class="text-2xl font-bold mb-6">Vynxgram</h1>
            
            <div id="auth-error" class="hidden bg-red-500/20 text-red-400 text-sm p-3 rounded mb-4"></div>

            <div id="login-form" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-bold text-textMuted uppercase mb-1">Nome de Utilizador</label>
                    <input type="text" id="login-user" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-brand">
                </div>
                <div>
                    <label class="block text-xs font-bold text-textMuted uppercase mb-1">Palavra-Passe</label>
                    <input type="password" id="login-pass" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-brand">
                </div>
                <button onclick="login()" class="w-full bg-brand hover:bg-brandHover text-white font-medium py-2.5 rounded transition">Entrar</button>
                <p class="text-xs text-textMuted text-center cursor-pointer hover:text-brand" onclick="toggleAuth()">Ainda não tens conta? Registar</p>
            </div>

            <div id="register-form" class="space-y-4 text-left hidden">
                <div>
                    <label class="block text-xs font-bold text-textMuted uppercase mb-1">Nome de Utilizador</label>
                    <input type="text" id="reg-user" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-brand">
                </div>
                <div>
                    <label class="block text-xs font-bold text-textMuted uppercase mb-1">Palavra-Passe</label>
                    <input type="password" id="reg-pass" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-brand">
                </div>
                <button onclick="register()" class="w-full bg-brand hover:bg-brandHover text-white font-medium py-2.5 rounded transition">Registar Conta</button>
                <p class="text-xs text-textMuted text-center cursor-pointer hover:text-brand" onclick="toggleAuth()">Já tens conta? Entrar</p>
            </div>
        </div>
    </div>

    <!-- APLICAÇÃO -->
    <div id="app-layout" class="hidden flex w-full h-full">
        <!-- Barra Esquerda (Servidores) -->
        <div class="w-[72px] bg-bgDark flex flex-col items-center py-3 gap-2 shrink-0 border-r border-bgMid" id="servers-list"></div>

        <!-- Barra Central (Canais e Perfil) -->
        <div class="w-60 bg-bgMid flex flex-col shrink-0 absolute md:relative z-40 h-full -translate-x-full md:translate-x-0 transition-transform duration-300" id="channels-sidebar">
            <div class="h-12 shadow-sm flex items-center px-4 font-semibold text-[15px] border-b border-bgDark">
                <span id="current-server-name" class="truncate">Servidor</span>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-0.5" id="channels-list"></div>
            
            <div class="h-[52px] bg-bgDark/40 flex items-center px-2 gap-2 shrink-0">
                <div class="w-8 h-8 rounded-full bg-brand flex items-center justify-center font-bold text-white overflow-hidden cursor-pointer" onclick="openSettings()" id="my-avatar"></div>
                <div class="flex-1 min-w-0 cursor-pointer" onclick="openSettings()">
                    <div class="text-sm font-semibold truncate leading-tight" id="my-name">Usuário</div>
                    <div class="text-[11px] text-textMuted truncate leading-tight" id="my-status">Online</div>
                </div>
                <button class="w-8 h-8 rounded text-textMuted hover:bg-bgHover hover:text-white" onclick="openSettings()"><i class="ph-bold ph-gear"></i></button>
            </div>
        </div>

        <!-- Área de Chat -->
        <div class="flex-1 bg-bgLight flex flex-col min-w-0 relative">
            <div class="h-12 flex items-center px-4 border-b border-bgDark/50 shadow-sm shrink-0 gap-3">
                <button class="md:hidden text-textMuted hover:text-textMain" onclick="document.getElementById('channels-sidebar').classList.toggle('-translate-x-full')"><i class="ph-bold ph-list text-xl"></i></button>
                <i class="ph-bold ph-hash text-textMuted text-xl"></i>
                <span class="font-semibold" id="current-channel-name">geral</span>
                <button class="ml-auto md:hidden text-textMuted hover:text-white" onclick="document.getElementById('members-sidebar').classList.toggle('hidden')"><i class="ph-bold ph-users text-xl"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col" id="chat-messages"></div>

            <div class="p-4 shrink-0">
                <div class="bg-bgHover rounded-lg flex items-center px-4 py-2.5 gap-3">
                    <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(event)">
                    <button class="text-textMuted hover:text-textMain transition-colors relative" onclick="document.getElementById('file-input').click()">
                        <i class="ph-bold ph-plus-circle text-xl"></i>
                        <span id="upload-status" class="absolute -top-8 left-0 bg-brand text-white text-xs px-2 py-1 rounded hidden">A Enviar...</span>
                    </button>
                    <input type="text" id="msg-input" class="flex-1 bg-transparent text-textMain focus:outline-none text-[15px]" placeholder="Enviar mensagem..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="text-textMuted hover:text-brand" onclick="sendMessage()"><i class="ph-bold ph-paper-plane-right text-xl"></i></button>
                </div>
            </div>
        </div>

        <!-- Barra Direita (Membros) -->
        <div class="w-60 bg-bgMid flex-col shrink-0 border-l border-bgDark hidden md:flex absolute md:relative right-0 h-full z-40" id="members-sidebar">
            <div class="p-4 pt-6 text-xs font-semibold text-textMuted uppercase tracking-wider">Membros</div>
            <div class="flex-1 overflow-y-auto p-2 space-y-1" id="members-list"></div>
        </div>
    </div>

    <!-- MODAL DE PERFIL/CONFIGURAÇÕES -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center">
        <div class="bg-bgLight w-full max-w-md rounded-xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-5 border-b border-bgDark flex justify-between items-center">
                <h2 class="text-xl font-bold">Definições da Conta</h2>
                <button class="text-textMuted hover:text-white" onclick="closeSettings()"><i class="ph-bold ph-x text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div><label class="block text-xs font-bold text-textMuted uppercase mb-1">Nome de Exibição</label><input type="text" id="set-display-name" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-brand"></div>
                <div><label class="block text-xs font-bold text-textMuted uppercase mb-1">URL do Avatar</label><input type="text" id="set-avatar" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-brand"></div>
                <div><label class="block text-xs font-bold text-textMuted uppercase mb-1">Biografia</label><input type="text" id="set-bio" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none focus:ring-1 focus:ring-brand"></div>
                <div><label class="block text-xs font-bold text-textMuted uppercase mb-1">Estado</label>
                    <select id="set-status" class="w-full bg-bgDark text-textMain p-2.5 rounded focus:outline-none">
                        <option value="Online">Online</option><option value="Ausente">Ausente</option><option value="Não Incomodar">Não Incomodar</option>
                    </select>
                </div>
            </div>
            <div class="p-5 bg-bgMid flex justify-between">
                <button class="text-red-400 hover:underline text-sm font-medium" onclick="logout()">Sair</button>
                <div class="flex gap-3"><button class="bg-brand hover:bg-brandHover text-white px-4 py-2 rounded text-sm transition" onclick="saveSettings()">Guardar Alterações</button></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE VISUALIZAÇÃO DE PERFIL DE OUTRO USUÁRIO -->
    <div id="profile-modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center">
        <div class="bg-bgLight w-full max-w-sm rounded-xl overflow-hidden shadow-2xl relative">
            <button class="absolute top-2 right-2 text-white z-10 p-1 bg-black/40 rounded-full hover:bg-red-500" onclick="document.getElementById('profile-modal').classList.replace('flex', 'hidden')"><i class="ph-bold ph-x text-lg"></i></button>
            <div class="h-24 bg-brand"></div>
            <div class="px-5 pb-5 relative">
                <div class="w-20 h-20 rounded-full border-4 border-bgLight bg-bgDark flex items-center justify-center text-3xl font-bold absolute -top-10 overflow-hidden" id="view-avatar">U</div>
                <div class="mt-12">
                    <h3 class="text-xl font-bold" id="view-name">Nome</h3>
                    <p class="text-sm text-textMuted mb-4">@<span id="view-user"></span></p>
                    <div class="bg-bgDark p-3 rounded text-sm mb-3">
                        <p class="text-xs font-bold text-textMuted uppercase mb-1">Sobre Mim</p>
                        <p id="view-bio">Sem biografia.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        let currentUser = null, currentServer = null, currentChannel = null, socket = null;

        document.addEventListener('DOMContentLoaded', async () => await checkAuth());

        async function api(endpoint, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const res = await fetch(endpoint, options);
            if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || 'Erro');
            return res.json();
        }

        async function checkAuth() {
            try { const data = await api('/api/me'); if (data.user) { currentUser = data.user; showApp(); initApp(); } } 
            catch { document.getElementById('auth-screen').classList.remove('hidden'); }
        }

        function toggleAuth() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('auth-error').classList.add('hidden');
        }
        function showError(msg) { const e = document.getElementById('auth-error'); e.textContent = msg; e.classList.remove('hidden'); }

        async function login() {
            try { currentUser = (await api('/api/login', 'POST', { username: document.getElementById('login-user').value, password: document.getElementById('login-pass').value })).user; showApp(); initApp(); } 
            catch (e) { showError(e.message); }
        }
        async function register() {
            try { currentUser = (await api('/api/register', 'POST', { username: document.getElementById('reg-user').value, password: document.getElementById('reg-pass').value })).user; showApp(); initApp(); } 
            catch (e) { showError(e.message); }
        }
        async function logout() { await api('/api/logout', 'POST'); location.reload(); }

        function showApp() {
            document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('app-layout').classList.remove('hidden');
            updateUI(currentUser.display_name, currentUser.avatar, currentUser.status);
        }

        function updateUI(name, avatar, status) {
            document.getElementById('my-name').textContent = name; document.getElementById('my-status').textContent = status;
            document.getElementById('my-avatar').innerHTML = avatar ? `<img src="${escapeHTML(avatar)}" class="w-full h-full object-cover">` : name.charAt(0).toUpperCase();
        }

        async function initApp() {
            socket = io(); socket.on('new_message', appendMessage); socket.on('user_status', () => currentServer && loadMembers(currentServer.id));
            const servers = await api('/api/servers');
            const list = document.getElementById('servers-list');
            list.innerHTML = `<div class="w-12 h-12 rounded-[24px] hover:rounded-2xl bg-bgMid hover:bg-brand text-brand hover:text-white flex items-center justify-center text-2xl transition-all duration-200 cursor-pointer"><i class="ph-fill ph-planet"></i></div><div class="w-8 h-[2px] bg-bgMid rounded"></div>`;
            servers.forEach(s => {
                const el = document.createElement('div');
                el.className = 'w-12 h-12 rounded-[24px] hover:rounded-2xl bg-bgMid text-textMain hover:bg-brand hover:text-white flex items-center justify-center text-lg font-bold transition-all duration-200 cursor-pointer server-btn';
                el.textContent = s.name.charAt(0); el.onclick = () => { document.querySelectorAll('.server-btn').forEach(btn => btn.classList.replace('rounded-2xl', 'rounded-[24px]')); el.classList.replace('rounded-[24px]', 'rounded-2xl'); selectServer(s); };
                list.appendChild(el);
            });
            if(servers.length > 0) { list.children[2].click(); }
        }

        async function selectServer(server) {
            currentServer = server; document.getElementById('current-server-name').textContent = server.name;
            const channels = await api(`/api/servers/${server.id}/channels`);
            const list = document.getElementById('channels-list'); list.innerHTML = '';
            channels.forEach((c, index) => {
                const el = document.createElement('div'); el.className = 'flex items-center px-2 py-1.5 rounded cursor-pointer text-textMuted hover:bg-bgHover hover:text-textMain ch-btn';
                el.innerHTML = `<i class="ph-bold ph-hash mr-2"></i> <span class="truncate">${c.name}</span>`;
                el.onclick = () => { document.querySelectorAll('.ch-btn').forEach(btn => btn.classList.remove('bg-bgHover', 'text-textMain')); el.classList.add('bg-bgHover', 'text-textMain'); selectChannel(c); };
                list.appendChild(el); if(index === 0) el.click();
            });
            loadMembers(server.id);
        }

        async function loadMembers(serverId) {
            const members = await api(`/api/servers/${serverId}/members`);
            const list = document.getElementById('members-list'); list.innerHTML = '';
            members.forEach(m => {
                const color = m.status === 'Online' ? 'bg-green-500' : (m.status === 'Ausente' ? 'bg-yellow-500' : 'bg-gray-500');
                const avatar = m.avatar ? `<img src="${escapeHTML(m.avatar)}" class="w-full h-full object-cover">` : m.display_name.charAt(0).toUpperCase();
                list.innerHTML += `<div class="flex items-center gap-3 p-2 rounded hover:bg-bgHover cursor-pointer" onclick="viewProfile('${m.id}')"><div class="relative w-8 h-8 rounded-full bg-brand flex items-center justify-center text-white shrink-0 font-bold overflow-visible"><div class="w-full h-full rounded-full overflow-hidden">${avatar}</div><div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 ${color} rounded-full border-2 border-bgMid"></div></div><div class="flex-1 min-w-0"><div class="text-[15px] font-medium truncate">${escapeHTML(m.display_name)}</div><div class="text-[11px] text-textMuted truncate">${m.status}</div></div></div>`;
            });
        }

        async function selectChannel(channel) {
            currentChannel = channel; document.getElementById('current-channel-name').textContent = channel.name;
            socket.emit('join_channel', channel.id);
            const messages = await api(`/api/channels/${channel.id}/messages`);
            const container = document.getElementById('chat-messages'); container.innerHTML = '';
            messages.forEach(appendMessage); scrollToBottom();
        }

        // LÓGICA DE UPLOAD
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file || !currentChannel) return;
            const statusEl = document.getElementById('upload-status'); statusEl.style.display = 'block';

            const formData = new FormData(); formData.append('file', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.url) socket.emit('send_message', { channelId: currentChannel.id, content: '', fileUrl: data.url, fileType: data.type, fileName: data.name });
            } catch (e) { alert('Erro ao fazer upload.'); }
            statusEl.style.display = 'none'; event.target.value = '';
        }

        function escapeHTML(str) { return (str||'').replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag])); }
        function buildEmbed(url, type, name) {
            if (!url) return '';
            if (type.startsWith('image/')) return `<img src="${escapeHTML(url)}" class="attachment-img" alt="imagem">`;
            if (type.startsWith('video/')) return `<video src="${escapeHTML(url)}" class="attachment-img" controls></video>`;
            return `<a href="${escapeHTML(url)}" download class="flex items-center gap-2 p-3 bg-bgDark rounded mt-2 hover:bg-bgHover text-brand w-fit border border-bgHover"><i class="ph-bold ph-file text-2xl"></i> <span class="text-textMain">${escapeHTML(name)}</span></a>`;
        }

        function appendMessage(msg) {
            const isSelf = msg.user_id === currentUser.id;
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const container = document.getElementById('chat-messages');
            const avatarHtml = msg.avatar ? `<img src="${escapeHTML(msg.avatar)}" class="w-full h-full object-cover">` : escapeHTML(msg.display_name.charAt(0));
            
            const contentHtml = msg.content ? `<div class="break-words text-[15px] leading-snug">${escapeHTML(msg.content)}</div>` : '';
            const embedHtml = buildEmbed(msg.file_url, msg.file_type, msg.file_name);

            let html = '';
            if (isSelf) {
                html = `<div class="flex gap-3 justify-end group"><div class="msg-bubble bg-brand text-white px-3.5 py-2 rounded-2xl rounded-tr-sm shadow-sm">${contentHtml}${embedHtml}<div class="text-[10px] text-white/70 text-right mt-1">${time}</div></div></div>`;
            } else {
                html = `<div class="flex gap-3 group"><div class="w-10 h-10 rounded-full bg-bgHover flex items-center justify-center font-bold text-white shrink-0 overflow-hidden cursor-pointer mt-0.5" onclick="viewProfile('${msg.user_id}')">${avatarHtml}</div><div class="flex flex-col items-start msg-bubble"><div class="flex items-baseline gap-2 ml-1 mb-0.5"><span class="font-medium text-[15px] cursor-pointer hover:underline text-white" onclick="viewProfile('${msg.user_id}')">${escapeHTML(msg.display_name)}</span><span class="text-[11px] text-textMuted">${time}</span></div><div class="bg-bgMid text-textMain px-3.5 py-2 rounded-2xl rounded-tl-sm shadow-sm">${contentHtml}${embedHtml}</div></div></div>`;
            }
            container.innerHTML += html; scrollToBottom();
        }

        function scrollToBottom() { const c = document.getElementById('chat-messages'); c.scrollTop = c.scrollHeight; }
        function sendMessage() {
            const i = document.getElementById('msg-input'); const c = i.value.trim();
            if (!c || !currentChannel) return;
            socket.emit('send_message', { channelId: currentChannel.id, content: c }); i.value = ''; i.focus();
        }

        function openSettings() { document.getElementById('set-display-name').value = currentUser.display_name; document.getElementById('set-avatar').value = currentUser.avatar || ''; document.getElementById('set-bio').value = currentUser.bio || ''; document.getElementById('set-status').value = currentUser.status || 'Online'; document.getElementById('settings-modal').classList.replace('hidden', 'flex'); }
        function closeSettings() { document.getElementById('settings-modal').classList.replace('flex', 'hidden'); }
        async function saveSettings() {
            try {
                const b = { display_name: document.getElementById('set-display-name').value, avatar: document.getElementById('set-avatar').value, bio: document.getElementById('set-bio').value, status: document.getElementById('set-status').value };
                await api('/api/profile', 'POST', b);
                currentUser = { ...currentUser, ...b }; updateUI(b.display_name, b.avatar, b.status); closeSettings(); if (currentServer) loadMembers(currentServer.id);
            } catch(e) { alert('Erro ao guardar'); }
        }
        
        async function viewProfile(id) {
            try {
                const u = await api(`/api/users/${id}`);
                document.getElementById('view-name').textContent = u.display_name; document.getElementById('view-user').textContent = u.username; document.getElementById('view-bio').textContent = u.bio || 'Sem biografia.';
                document.getElementById('view-avatar').innerHTML = u.avatar ? `<img src="${escapeHTML(u.avatar)}" class="w-full h-full object-cover">` : u.display_name.charAt(0).toUpperCase();
                document.getElementById('profile-modal').classList.replace('hidden', 'flex');
            } catch(e) {}
        }
    </script>
</body>
</html>
